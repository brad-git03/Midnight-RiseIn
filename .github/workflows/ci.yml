name: Vansidian CI & ZK Security Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Compact Contract & Security Invariant Test Suite
  security-and-circuit-audit:
    name: ZK Circuit & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Verify Compact Compiled ZK Artifacts
        run: |
          test -f managed/vansidian/contract/index.js || { echo "Missing compiled contract bundle"; exit 1; }
          test -f managed/vansidian/keys/increment.verifier || { echo "Missing increment verifier key"; exit 1; }
          test -f managed/vansidian/keys/processPayrollBatch.verifier || { echo "Missing processPayrollBatch verifier key"; exit 1; }
          echo "All Compact v0.31.1 ZK artifacts verified."

      - name: Run Formal Security & Scalability Test Suite
        run: npm test

  # Job 2: Frontend Production Build & Asset Validation
  frontend-build:
    name: Production SaaS Build & Asset Verification
    runs-on: ubuntu-latest
    needs: security-and-circuit-audit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Vite Production Bundle
        run: npm run build

      - name: Validate Production Build Output
        run: |
          test -f dist/index.html || { echo "Missing index.html"; exit 1; }
          test -f dist/logo.png || { echo "Missing logo.png asset"; exit 1; }
          echo "Production frontend build and core brand assets completed with 0 errors."
